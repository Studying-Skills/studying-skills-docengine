[package]
name = "sfdoc-wasm"
description = "JavaScript bindings of the StudyFlow document engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen expands to code with `unsafe`, so this crate cannot take the workspace's `forbid(unsafe_code)`.
# It holds no logic of its own: every function forwards to `Engine` in `engine.rs`, which is plain safe Rust.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
sfdoc-model = { workspace = true }
sfdoc-fonts = { workspace = true }
sfdoc-layout = { workspace = true }
sfdoc-pdf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
