[package]
name = "sfdoc-spell-wasm"
description = "JavaScript bindings of the StudyFlow speller (a separate wasm module: it loads only when spelling is on)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
sfdoc-spell = { workspace = true }
wasm-bindgen = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
