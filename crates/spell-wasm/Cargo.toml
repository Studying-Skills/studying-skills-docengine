[package]
name = "sfdoc-spell-wasm"
description = "JavaScript bindings of the StudyFlow speller (a separate wasm module: it loads only when spelling is on)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen expands to code with `unsafe`, so this crate cannot take the workspace's `forbid(unsafe_code)`.
# It holds no logic of its own: every function forwards to `sfdoc_spell::Speller`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
sfdoc-spell = { workspace = true }
wasm-bindgen = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
