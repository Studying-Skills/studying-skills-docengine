<!doctype html><meta charset="utf-8"><title>S1 geometry</title>
<body style="margin:0"><div id="host" style="position:absolute;left:0;top:0"></div>
<script type="module">
import init, { Engine } from './pkg/s1_geometry.js';
const q = new URLSearchParams(location.search);
const SIZE = parseFloat(q.get('size') ?? '18.666666');
const RENDERING = q.get('rendering') ?? 'auto';
window.run = async () => { try { return await run0(); } catch (e) { return { err: String(e), stack: e.stack }; } };
const run0 = async () => {
  await init();
  const bytes = new Uint8Array(await (await fetch('/font.ttf')).arrayBuffer());
  const ff = new FontFace('LS', bytes.buffer.slice(0));
  await ff.load(); document.fonts.add(ff);
  const engine = new Engine(bytes);
  const lines = await (await fetch('./lines.json')).json();
  const host = document.getElementById('host');
  const wordDiffs = [], lineDiffs = [], rel = [];
  let worst = null;
  let skipped = 0, worstLine = null;
  const iso = document.createElement('div'); document.body.append(iso);
  for (const line of lines) {
    if (engine.has_notdef(line)) { skipped++; continue; }
    const css = `white-space:pre;font:${SIZE}px LS;text-rendering:${RENDERING};font-kerning:normal`;
    const div = document.createElement('div');
    div.style.cssText = `position:absolute;left:0;top:0;${css}`;
    const outer = document.createElement('span'); outer.textContent = line; div.append(outer); host.replaceChildren(div);
    const words = line.split(' ');
    // every word in its own absolutely positioned box — the way the page painter will place them
    const boxes = words.map((w) => { const s = document.createElement('span'); s.style.cssText = `position:absolute;left:0;top:40px;${css}`; s.textContent = w; return s; });
    iso.replaceChildren(...boxes);
    const m = engine.measure_line(line, SIZE);
    boxes.forEach((s, i) => {
      const bw = s.getBoundingClientRect().width; const d = bw - m[i];
      wordDiffs.push(Math.abs(d));
      if (!worst || Math.abs(d) > Math.abs(worst.d)) worst = { d, word: words[i], browser: bw, engine: m[i] };
    });
    const lw = outer.getBoundingClientRect().width; const ld = lw - m[m.length - 1];
    lineDiffs.push(Math.abs(ld));
    if (!worstLine || Math.abs(ld) > Math.abs(worstLine.d)) worstLine = { d: ld, line };
  }
  const stat = (a) => { const s = [...a].sort((x, y) => x - y); return { n: s.length, mean: s.reduce((x, y) => x + y, 0) / s.length, p50: s[s.length >> 1], p99: s[Math.floor(s.length * 0.99)], max: s[s.length - 1] }; };
  // S6: layout timing on ~50 pages of text
  const paras = await (await fetch('./bench.json')).json();
  const text = paras.join('\n');
  const W = 642.5; // 170 mm text width in px
  engine.clear_cache();
  let t = performance.now(); const linesCold = engine.layout_all(text, SIZE, W); const cold = performance.now() - t;
  t = performance.now(); engine.layout_all(text, SIZE, W); const warm = performance.now() - t;
  const edits = [];
  for (let i = 0; i < 200; i++) { const idx = (i * 7) % paras.length; const p = paras[idx].slice(0, 40) + 'щ' + i + paras[idx].slice(40); const t0 = performance.now(); engine.relayout(idx, p, SIZE, W); edits.push(performance.now() - t0); }
  return { size: SIZE, rendering: RENDERING, dpr: devicePixelRatio, word: stat(wordDiffs), line: stat(lineDiffs), worst, worstLine, skipped, bench: { chars: text.length, lines: linesCold, pages: linesCold / 30, coldMs: cold, warmMs: warm, edit: stat(edits) } };
};
</script>
