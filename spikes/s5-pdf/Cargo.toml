[package]
name = "s5-pdf"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
krilla = { version = "0.8.2", default-features = false, features = ["simple-text", "raster-images"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
