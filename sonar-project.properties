# SonarQube analysis settings, for the local scan (the token is passed on the command line, never stored here).
#
# SonarQube Community Build has no Rust analyzer, so Rust files are covered by the Clippy findings imported
# through sonar.externalIssuesReportPaths (generated into target/ by the scan).
# The native analyzers cover the JavaScript, HTML, CSS and Python files.
sonar.projectKey=studying-skills-docengine
sonar.projectName=studying-skills-docengine

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/tests.rs,**/*.test.*,**/test.mjs

# Build output, dependencies, generated wasm-bindgen output, corpus documents, snapshots and font binaries are
# not source. scripts/check-language.mjs is vendored and mirrors the exclusion in .sonarcloud.properties
# (it takes the directory to scan from the command line and runs git, which is its purpose).
sonar.exclusions=target/**,**/node_modules/**,**/pkg/**,**/*.wasm,corpus/**,**/tests/snapshots/**,assets/fonts/**,.worktrees/**,scripts/check-language.mjs

sonar.sourceEncoding=UTF-8
