# SonarCloud automatic analysis settings.
#
# scripts/check-language.mjs is a vendored developer tool: it scans the directory given on the
# command line and runs git, so the path-from-argument and PATH findings (jssecurity:S8707,
# javascript:S4036) describe its purpose. Automatic analysis ignores per-rule issue exclusions,
# so the file is left out of the analysis. Nothing else is excluded.
sonar.exclusions=scripts/check-language.mjs
